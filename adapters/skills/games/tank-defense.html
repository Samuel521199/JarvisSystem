<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Jarvis · Tank Defense</title><style>
:root{color-scheme:dark;font-family:system-ui,'Microsoft YaHei',sans-serif;background:#0a1118;color:#edf5ef}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#20352e,transparent 65%),#0a1118}main{max-width:1040px;margin:auto;padding:26px 24px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}small{color:#9ab7a6;letter-spacing:.16em;font-size:10px}h1{font-size:clamp(22px,4vw,36px);margin:7px 0 10px;font-weight:650}button{background:#1b3029;color:#e5f4e9;border:1px solid #486656;border-radius:8px;padding:10px 17px;cursor:pointer;font:inherit}button:hover,button:focus-visible{background:#315140;outline:2px solid #b2db8f;outline-offset:2px}#hud{display:flex;gap:22px;flex-wrap:wrap;font-size:13px;color:#b3c9ba;margin:13px 0}#stage{position:relative;border:1px solid #4b6153;border-radius:16px;overflow:hidden;box-shadow:0 24px 80px #0008;background:#19231e}canvas{display:block;width:100%;height:auto;aspect-ratio:4/3;touch-action:none}#overlay{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:#06100ab3;backdrop-filter:blur(5px);padding:20px}#overlay[hidden]{display:none}#overlay h2{font-size:32px;margin:0 0 10px}#overlay p{color:#b8cbbd;max-width:460px;line-height:1.8}nav{display:flex;gap:10px;align-items:center;margin:15px 0}.hint{font-size:12px;color:#91a997;line-height:1.8}.badge{border:1px solid #486656;border-radius:20px;padding:7px 12px;font-size:11px;color:#bdd6bb;white-space:nowrap}#touch{display:none;gap:9px;flex-wrap:wrap;margin:12px 0}#touch button{min-width:46px;touch-action:none;user-select:none}footer{margin-top:16px;color:#789384;font-size:11px}@media(max-width:600px){main{padding:16px 12px}header{align-items:flex-start}.badge{display:none}#hud{gap:12px;font-size:12px}#touch{display:flex}#overlay h2{font-size:24px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body><main><header><div><small>JARVIS / OFFLINE ARCADE / 01</small><h1 id="title">装甲前线 · 基地守卫</h1></div><span class="badge">AI 关卡设计 · 固定 2D 引擎</span></header>
<div id="hud" role="status"><span id="base-stat"></span><span id="wave-stat"></span><span id="score-stat"></span><span id="state-stat"></span></div>
<div id="stage"><canvas id="game" width="800" height="600" tabindex="0" aria-label="坦克守卫战场：WASD移动，鼠标瞄准，空格射击"></canvas><div id="overlay"><h2 id="headline">守住最后的基地</h2><p id="description">驾驶你的坦克，阻止敌方装甲突破。WASD / 方向键移动，鼠标瞄准，点击或空格射击。</p><button id="start">开始守卫</button></div></div>
<nav><button id="pause">暂停</button><button id="restart">重新开始</button><span class="hint">P 暂停 · R 重开 · 关闭页面即停止</span></nav>
<div id="touch" aria-label="触屏操作"><button data-key="a" aria-label="向左">←</button><button data-key="w" aria-label="向上">↑</button><button data-key="s" aria-label="向下">↓</button><button data-key="d" aria-label="向右">→</button><button data-key=" " aria-label="射击">开火</button></div>
<p class="hint">WASD / 方向键移动 · 鼠标瞄准 · 点击 / 空格开火。触屏可点战场设置瞄准点，再按住开火。基地生命归零即失败，清除所有波次获胜。</p>
<footer>自包含 HTML · 无网络与第三方资源 · 2D 阴影绘制，不是完整 3D 游戏</footer></main>
<script>
(()=>{'use strict';const design=/* JARVIS_GAME_DESIGN */;
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d');document.title=design.title+' · Jarvis';$('title').textContent=design.title;
let state,manual=false,last=0,keys=new Set(),control={fire:false,aimX:400,aimY:0},seed=1;
const snap=()=>JSON.parse(JSON.stringify({...state,design}));
function reset(start=true){keys.clear();control={fire:false,aimX:400,aimY:0};seed=1;state={status:start?'playing':'ready',paused:false,player:{x:400,y:470,angle:-Math.PI/2},baseHP:design.base_hp,wave:0,spawned:0,kills:0,time:0,cooldown:0,spawnTimer:0,enemies:[],bullets:[],sparks:[]};hud();draw();}
function hud(){const s=state;$('base-stat').textContent='基地 '+s.baseHP+' / '+design.base_hp;$('wave-stat').textContent='波次 '+Math.min(s.wave+1,design.waves.length)+' / '+design.waves.length;$('score-stat').textContent='击毁 '+s.kills;$('state-stat').textContent=s.paused?'已暂停':({ready:'等待出发',playing:'守卫中',won:'防线稳固',lost:'基地失守'})[s.status];$('pause').textContent=s.paused?'继续':'暂停';const show=s.status!=='playing';$('overlay').hidden=!show;if(show){$('headline').textContent=s.status==='won'?'防线稳固 · 任务完成':s.status==='lost'?'基地失守 · 再次出击':'守住最后的基地';$('description').textContent=s.status==='ready'?'WASD / 方向键移动，鼠标瞄准，点击或空格射击。清除所有敌军，保卫基地。':'本局击毁 '+s.kills+' 辆敌方坦克。调整路线与射击角度，再试一次。';$('start').textContent=s.status==='ready'?'开始守卫':'再次出击';}}
function blocked(x,y,r){return x<r||x>800-r||y<r||y>600-r||design.obstacles.some(o=>x+r>o.x&&x-r<o.x+o.width&&y+r>o.y&&y-r<o.y+o.height)||Math.abs(x-400)<r+31&&Math.abs(y-548)<r+22;}
function burst(x,y){for(let i=0;i<9;i++)state.sparks.push({x,y,vx:Math.cos(i*2.4)*75,vy:Math.sin(i*2.4)*75,life:.45});}
function update(dt){dt=Math.max(0,Math.min(.05,Number(dt)||0));const s=state;if(s.status!=='playing'||s.paused)return;s.time+=dt;s.cooldown-=dt;s.spawnTimer-=dt;const p=s.player;
let dx=(keys.has('d')||keys.has('ArrowRight')?1:0)-(keys.has('a')||keys.has('ArrowLeft')?1:0),dy=(keys.has('s')||keys.has('ArrowDown')?1:0)-(keys.has('w')||keys.has('ArrowUp')?1:0);const mag=Math.hypot(dx,dy)||1;
if(!blocked(p.x+dx/mag*185*dt,p.y,18))p.x+=dx/mag*185*dt;if(!blocked(p.x,p.y+dy/mag*185*dt,18))p.y+=dy/mag*185*dt;p.angle=Math.atan2(control.aimY-p.y,control.aimX-p.x);
if((control.fire||keys.has(' '))&&s.cooldown<=0){s.bullets.push({x:p.x+Math.cos(p.angle)*27,y:p.y+Math.sin(p.angle)*27,vx:Math.cos(p.angle)*540,vy:Math.sin(p.angle)*540});s.cooldown=.15;}
if(s.spawned<design.waves[s.wave]&&s.spawnTimer<=0){const x=[400,95,705][s.spawned%3];s.enemies.push({id:seed++,x,y:25,angle:Math.PI/2});s.spawned++;s.spawnTimer=1.25;}
for(const e of s.enemies){const tx=400,ty=548;const a=Math.atan2(ty-e.y,tx-e.x);e.angle=a;const nx=e.x+Math.cos(a)*design.enemy_speed*dt,ny=e.y+Math.sin(a)*design.enemy_speed*dt;
if(!design.obstacles.some(o=>nx+18>o.x&&nx-18<o.x+o.width&&ny+18>o.y&&ny-18<o.y+o.height)){e.x=nx;e.y=ny;}else{e.x+=Math.sign(400-e.x)*design.enemy_speed*dt;}
if(Math.hypot(e.x-400,e.y-548)<38){e.attack=(e.attack||0)-dt;if(e.attack<=0){s.baseHP=Math.max(0,s.baseHP-1);e.attack=1;burst(400,548);}}}
for(const b of s.bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.x<0||b.y<0||b.x>800||b.y>600||design.obstacles.some(o=>b.x>o.x&&b.x<o.x+o.width&&b.y>o.y&&b.y<o.y+o.height))b.dead=true;
if(!b.dead)for(const e of s.enemies)if(!e.dead&&Math.hypot(b.x-e.x,b.y-e.y)<21){e.dead=true;b.dead=true;s.kills++;burst(e.x,e.y);break;}}
s.enemies=s.enemies.filter(e=>!e.dead);s.bullets=s.bullets.filter(b=>!b.dead);for(const f of s.sparks){f.x+=f.vx*dt;f.y+=f.vy*dt;f.life-=dt;}s.sparks=s.sparks.filter(f=>f.life>0);
if(s.baseHP===0)s.status='lost';else if(s.spawned===design.waves[s.wave]&&!s.enemies.length){if(s.wave===design.waves.length-1)s.status='won';else{s.wave++;s.spawned=0;s.spawnTimer=1.5;}}hud();}
function tank(t,color){ctx.save();ctx.translate(t.x,t.y);ctx.rotate(t.angle+Math.PI/2);ctx.shadowColor='#0009';ctx.shadowBlur=8;ctx.shadowOffsetY=6;ctx.fillStyle='#101917';ctx.fillRect(-20,-24,10,48);ctx.fillRect(10,-24,10,48);ctx.shadowBlur=0;ctx.shadowOffsetY=0;for(let y=-21;y<24;y+=7){ctx.fillStyle='#607067';ctx.fillRect(-20,y,10,2);ctx.fillRect(10,y,10,2);}const g=ctx.createLinearGradient(-15,0,15,0);g.addColorStop(0,'#18251e');g.addColorStop(.4,color);g.addColorStop(1,'#2b3b30');ctx.fillStyle=g;ctx.fillRect(-14,-23,28,46);ctx.strokeStyle='#c4dfad70';ctx.strokeRect(-13,-22,26,44);ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(-10,-12,20,25,5);ctx.fill();ctx.fillStyle='#24352a';ctx.fillRect(-3,-37,6,29);ctx.fillStyle='#aec69c';ctx.fillRect(-3,-37,6,4);ctx.fillStyle='#12241d';ctx.fillRect(-4,-4,8,5);ctx.restore();}
function draw(){if(!state)return;ctx.fillStyle=design.ground_color;ctx.fillRect(0,0,800,600);const glow=ctx.createRadialGradient(400,280,40,400,280,500);glow.addColorStop(0,'#ffffff09');glow.addColorStop(1,'#00000065');ctx.fillStyle=glow;ctx.fillRect(0,0,800,600);ctx.strokeStyle='#b1ccae09';ctx.lineWidth=1;for(let x=0;x<=800;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,600);ctx.stroke();}for(let y=0;y<=600;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(800,y);ctx.stroke();}ctx.strokeStyle='#8db17d50';ctx.setLineDash([8,8]);ctx.strokeRect(28,18,744,558);ctx.setLineDash([]);
for(const o of design.obstacles){ctx.fillStyle='#080d0aaa';ctx.fillRect(o.x+5,o.y+7,o.width,o.height);ctx.fillStyle='#5b6751';ctx.fillRect(o.x,o.y,o.width,o.height);ctx.fillStyle='#899372';ctx.fillRect(o.x,o.y,o.width,4);ctx.strokeStyle='#202e26';ctx.strokeRect(o.x,o.y,o.width,o.height);}ctx.fillStyle='#a3b4a1';ctx.fillRect(369,526,62,42);ctx.fillStyle='#344e41';ctx.fillRect(375,532,50,30);ctx.fillStyle='#cbdcb2';ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillText('BASE',400,552);ctx.strokeStyle='#93bd86';ctx.beginPath();ctx.arc(400,548,48,0,Math.PI*2);ctx.stroke();
tank(state.player,design.player_color);for(const e of state.enemies)tank(e,design.enemy_color);for(const b of state.bullets){ctx.fillStyle='#fff0a0';ctx.shadowColor='#f7a93b';ctx.shadowBlur=12;ctx.beginPath();ctx.arc(b.x,b.y,3,0,7);ctx.fill();}ctx.shadowBlur=0;for(const f of state.sparks){ctx.globalAlpha=Math.max(0,f.life/.45);ctx.fillStyle='#ffd985';ctx.fillRect(f.x,f.y,4,4);}ctx.globalAlpha=1;ctx.strokeStyle='#e0eacb90';ctx.beginPath();ctx.arc(control.aimX,control.aimY,9,0,7);ctx.moveTo(control.aimX-14,control.aimY);ctx.lineTo(control.aimX+14,control.aimY);ctx.moveTo(control.aimX,control.aimY-14);ctx.lineTo(control.aimX,control.aimY+14);ctx.stroke();if(state.paused){ctx.fillStyle='#06100a99';ctx.fillRect(0,0,800,600);ctx.fillStyle='#d5e5d2';ctx.font='28px system-ui';ctx.fillText('已暂停',400,300);}}
function pause(){if(state.status==='playing'){state.paused=!state.paused;keys.clear();control.fire=false;hud();draw();}}
window.addEventListener('keydown',e=>{if(['w','a','s','d','ArrowUp','ArrowLeft','ArrowDown','ArrowRight',' '].includes(e.key)){e.preventDefault();keys.add(e.key);}if(!e.repeat&&e.key.toLowerCase()==='p')pause();if(!e.repeat&&e.key.toLowerCase()==='r')reset();});window.addEventListener('keyup',e=>keys.delete(e.key));
canvas.addEventListener('pointermove',e=>{const r=canvas.getBoundingClientRect();control.aimX=(e.clientX-r.left)*800/r.width;control.aimY=(e.clientY-r.top)*600/r.height;});canvas.addEventListener('pointerdown',e=>{canvas.dispatchEvent(new PointerEvent('pointermove',{clientX:e.clientX,clientY:e.clientY}));control.fire=true;canvas.focus();});window.addEventListener('pointerup',()=>{control.fire=false;keys.clear();});window.addEventListener('pointercancel',()=>{control.fire=false;keys.clear();});window.addEventListener('blur',()=>{if(state.status==='playing'&&!state.paused)pause();});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.status==='playing'&&!state.paused)pause();});
for(const b of document.querySelectorAll('[data-key]')){b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(b.dataset.key);};b.onpointerup=b.onpointercancel=()=>keys.delete(b.dataset.key);}
$('start').onclick=()=>reset();$('restart').onclick=()=>reset();$('pause').onclick=pause;window.__jarvisGame={snapshot:snap,manual:v=>{manual=!!v;},advance:dt=>{update(dt);},input:v=>{control={...control,...v};}};reset(false);function frame(t){if(!manual)update(last?(t-last)/1000:0);last=t;draw();requestAnimationFrame(frame);}requestAnimationFrame(frame);
})();
</script></body></html>
